name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: node --check server.js && for f in controllers/*.js routes/*.js middleware/*.js utils/*.js config/*.js; do node --check "$f" || exit 1; done
        working-directory: backend
      - run: npx prisma validate
        working-directory: backend
      - run: npm test
        working-directory: backend
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check sw.js && node --check config.js && node --check js/app.js && node --check js/auth.js
        working-directory: frontend
      - run: node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8'))"
        working-directory: frontend
